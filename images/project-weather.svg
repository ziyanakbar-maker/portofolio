<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadowWeather">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.35" flood-color="#000" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bgWeather)" />

  <g filter="url(#shadowWeather)">
    <!-- App Window Frame -->
    <rect x="30" y="30" width="540" height="320" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Window Titlebar -->
    <rect x="30" y="30" width="540" height="42" rx="12" fill="#0f172a" />
    <circle cx="55" cy="51" r="6" fill="#ef4444" />
    <circle cx="75" cy="51" r="6" fill="#f59e0b" />
    <circle cx="95" cy="51" r="6" fill="#10b981" />
    <rect x="130" y="40" width="280" height="22" rx="11" fill="#1e293b" />
    <text x="270" y="55" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">weatherid.app • Cuaca Interaktif &amp; Prediksi</text>

    <!-- Main Weather Info Card -->
    <rect x="50" y="85" width="280" height="240" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="70" y="115" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold">Jakarta, Indonesia</text>
    <text x="70" y="135" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Cerah Berawan • Hari Ini</text>
    
    <!-- Big Sun / Weather Icon -->
    <circle cx="110" cy="190" r="32" fill="url(#sunGrad)" />
    <!-- Cloud overlapping sun -->
    <path d="M 100,215 A 20,20 0 0,1 130,205 A 25,25 0 0,1 170,215 A 15,15 0 0,1 165,230 L 95,230 A 15,15 0 0,1 100,215 Z" fill="#ffffff" opacity="0.9" />

    <text x="195" y="195" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="bold">31°C</text>
    <text x="195" y="215" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Terasa seperti 34°C</text>

    <!-- Weather details -->
    <rect x="65" y="250" width="115" height="55" rx="6" fill="#1e293b" />
    <text x="75" y="270" fill="#94a3b8" font-size="10">Kelembaban</text>
    <text x="75" y="292" fill="#38bdf8" font-size="14" font-weight="bold">72%</text>

    <rect x="195" y="250" width="115" height="55" rx="6" fill="#1e293b" />
    <text x="205" y="270" fill="#94a3b8" font-size="10">Kecepatan Angin</text>
    <text x="205" y="292" fill="#10b981" font-size="14" font-weight="bold">14 km/h</text>

    <!-- 4-Day Forecast Sidebar -->
    <rect x="345" y="85" width="205" height="240" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="360" y="112" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold">Prediksi 4 Hari Kedepan</text>
    
    <!-- Day 1 -->
    <text x="360" y="145" fill="#cbd5e1" font-size="11">Besok</text>
    <circle cx="430" cy="141" r="7" fill="#f59e0b" />
    <text x="495" y="145" fill="#f8fafc" font-size="11" font-weight="bold">32° / 25°</text>

    <!-- Day 2 -->
    <text x="360" y="185" fill="#cbd5e1" font-size="11">Rabu</text>
    <circle cx="430" cy="181" r="7" fill="#38bdf8" />
    <text x="495" y="185" fill="#f8fafc" font-size="11" font-weight="bold">29° / 24°</text>

    <!-- Day 3 -->
    <text x="360" y="225" fill="#cbd5e1" font-size="11">Kamis</text>
    <circle cx="430" cy="221" r="7" fill="#f59e0b" />
    <text x="495" y="225" fill="#f8fafc" font-size="11" font-weight="bold">30° / 24°</text>

    <!-- Day 4 -->
    <text x="360" y="265" fill="#cbd5e1" font-size="11">Jumat</text>
    <circle cx="430" cy="261" r="7" fill="#10b981" />
    <text x="495" y="265" fill="#f8fafc" font-size="11" font-weight="bold">31° / 25°</text>
  </g>
</svg>
