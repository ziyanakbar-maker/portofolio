<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e3a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadowTask">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.35" flood-color="#000" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bgTask)" />

  <g filter="url(#shadowTask)">
    <!-- App Frame -->
    <rect x="30" y="30" width="540" height="320" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />

    <!-- Window Bar -->
    <rect x="30" y="30" width="540" height="42" rx="12" fill="#0f172a" />
    <circle cx="55" cy="51" r="6" fill="#ef4444" />
    <circle cx="75" cy="51" r="6" fill="#f59e0b" />
    <circle cx="95" cy="51" r="6" fill="#10b981" />
    <rect x="130" y="40" width="280" height="22" rx="11" fill="#1e293b" />
    <text x="270" y="55" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">taskflow.app • Kanban Project Tracker</text>

    <!-- Subheader with stats -->
    <rect x="50" y="85" width="500" height="45" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="65" y="112" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold">Sprint 4: Website Redesign</text>
    <rect x="340" y="97" width="85" height="22" rx="11" fill="#10b981" opacity="0.2" />
    <text x="382" y="112" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">85% Selesai</text>
    <rect x="435" y="97" width="100" height="22" rx="6" fill="#3b82f6" />
    <text x="485" y="112" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">+ Tugas Baru</text>

    <!-- Kanban Columns -->
    <!-- Column 1: To Do -->
    <rect x="50" y="145" width="155" height="185" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="68" cy="165" r="5" fill="#f59e0b" />
    <text x="82" y="169" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold">To Do (2)</text>
    
    <!-- Task Card 1.1 -->
    <rect x="60" y="185" width="135" height="58" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <rect x="68" y="193" width="45" height="14" rx="3" fill="#ef4444" opacity="0.2" />
    <text x="90" y="204" fill="#ef4444" font-size="9" font-weight="bold" text-anchor="middle">High</text>
    <text x="68" y="222" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Integrasi API Payment</text>

    <!-- Task Card 1.2 -->
    <rect x="60" y="252" width="135" height="58" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <rect x="68" y="260" width="45" height="14" rx="3" fill="#3b82f6" opacity="0.2" />
    <text x="90" y="271" fill="#3b82f6" font-size="9" font-weight="bold" text-anchor="middle">Design</text>
    <text x="68" y="289" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Mockup Halaman Detail</text>

    <!-- Column 2: In Progress -->
    <rect x="222" y="145" width="155" height="185" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="240" cy="165" r="5" fill="#3b82f6" />
    <text x="254" y="169" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold">In Progress (1)</text>

    <!-- Task Card 2.1 -->
    <rect x="232" y="185" width="135" height="70" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="240" y="193" width="55" height="14" rx="3" fill="#f59e0b" opacity="0.2" />
    <text x="267" y="204" fill="#f59e0b" font-size="9" font-weight="bold" text-anchor="middle">Frontend</text>
    <text x="240" y="222" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Slicing UI Responsif</text>
    <rect x="240" y="238" width="115" height="6" rx="3" fill="#334155" />
    <rect x="240" y="238" width="80" height="6" rx="3" fill="#3b82f6" />

    <!-- Column 3: Done -->
    <rect x="395" y="145" width="155" height="185" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="413" cy="165" r="5" fill="#10b981" />
    <text x="427" y="169" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold">Done (3)</text>

    <!-- Task Card 3.1 -->
    <rect x="405" y="185" width="135" height="58" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <rect x="413" y="193" width="45" height="14" rx="3" fill="#10b981" opacity="0.2" />
    <text x="435" y="204" fill="#10b981" font-size="9" font-weight="bold" text-anchor="middle">Ready</text>
    <text x="413" y="222" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-decoration="line-through">Setup Database Schema</text>

    <!-- Task Card 3.2 -->
    <rect x="405" y="252" width="135" height="58" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <rect x="413" y="260" width="45" height="14" rx="3" fill="#10b981" opacity="0.2" />
    <text x="435" y="271" fill="#10b981" font-size="9" font-weight="bold" text-anchor="middle">Ready</text>
    <text x="413" y="289" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-decoration="line-through">Konfigurasi Auth Token</text>
  </g>
</svg>
