<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEcom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentEcom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadowEcom">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.35" flood-color="#000" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" rx="16" fill="url(#bgEcom)" />

  <!-- App Window Container -->
  <g filter="url(#shadowEcom)">
    <!-- Browser Window Frame -->
    <rect x="30" y="30" width="540" height="320" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
    
    <!-- Window Header / Titlebar -->
    <rect x="30" y="30" width="540" height="42" rx="12" fill="#0f172a" />
    <circle cx="55" cy="51" r="6" fill="#ef4444" />
    <circle cx="75" cy="51" r="6" fill="#f59e0b" />
    <circle cx="95" cy="51" r="6" fill="#10b981" />
    
    <!-- URL Bar -->
    <rect x="130" y="40" width="300" height="22" rx="11" fill="#1e293b" />
    <text x="280" y="55" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">tokokita.store • E-Commerce Modern</text>
    
    <!-- User/Cart Icon Mockup -->
    <circle cx="490" cy="51" r="10" fill="#334155" />
    <circle cx="525" cy="51" r="10" fill="url(#accentEcom)" />
    <text x="525" y="55" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">3</text>

    <!-- Store Hero Banner Inside App -->
    <rect x="50" y="90" width="500" height="85" rx="8" fill="url(#accentEcom)" />
    <text x="75" y="125" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold">Mega Promo Elektronik</text>
    <text x="75" y="148" fill="#f1f5f9" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Diskon hingga 50% untuk kebutuhan dev &amp; gadgets</text>
    <rect x="420" y="112" width="110" height="34" rx="6" fill="#ffffff" />
    <text x="475" y="133" fill="#4f46e5" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Beli Sekarang</text>

    <!-- Product Grid Mockup -->
    <!-- Card 1 -->
    <rect x="50" y="190" width="150" height="135" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="62" y="202" width="126" height="60" rx="6" fill="#334155" />
    <circle cx="125" cy="232" r="18" fill="#6366f1" opacity="0.8" />
    <text x="62" y="280" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold">Laptop Pro 16"</text>
    <text x="62" y="298" fill="#10b981" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold">Rp 18.999.000</text>
    <rect x="150" y="285" width="38" height="22" rx="4" fill="#6366f1" />
    <text x="169" y="300" fill="#fff" font-size="11" text-anchor="middle">+</text>

    <!-- Card 2 -->
    <rect x="225" y="190" width="150" height="135" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="237" y="202" width="126" height="60" rx="6" fill="#334155" />
    <circle cx="300" cy="232" r="18" fill="#ec4899" opacity="0.8" />
    <text x="237" y="280" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold">Mechanical Keyboard</text>
    <text x="237" y="298" fill="#10b981" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold">Rp 1.450.000</text>
    <rect x="325" y="285" width="38" height="22" rx="4" fill="#6366f1" />
    <text x="344" y="300" fill="#fff" font-size="11" text-anchor="middle">+</text>

    <!-- Card 3 -->
    <rect x="400" y="190" width="150" height="135" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="412" y="202" width="126" height="60" rx="6" fill="#334155" />
    <circle cx="475" cy="232" r="18" fill="#10b981" opacity="0.8" />
    <text x="412" y="280" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold">Studio Headphone</text>
    <text x="412" y="298" fill="#10b981" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold">Rp 2.100.000</text>
    <rect x="500" y="285" width="38" height="22" rx="4" fill="#6366f1" />
    <text x="519" y="300" fill="#fff" font-size="11" text-anchor="middle">+</text>
  </g>
</svg>
